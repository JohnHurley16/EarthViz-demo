<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Earth Viewer — Phase 0</title>
    <script type="module" crossorigin src="/EarthViz-demo/assets/index-BFNgTMAw.js"></script>
    <link rel="stylesheet" crossorigin href="/EarthViz-demo/assets/index-Ba4UcoD_.css">
  </head>
  <body>
    <div id="cesiumContainer"></div>

    <div id="controlPanel" class="panel">
      <h1>Earth Viewer</h1>
      <label class="row">
        <span>Imagery</span>
        <select id="layerSelect"></select>
      </label>
      <label class="row">
        <span>Satellites</span>
        <select id="satGroupSelect">
          <option value="stations" selected>Stations (ISS, CSS…)</option>
          <option value="weather">Weather satellites</option>
          <option value="none">Hidden</option>
        </select>
      </label>
      <div class="row">
        <span>Overlays</span>
        <label class="check"><input type="checkbox" id="ovSnowCover" /> Snow</label>
        <label class="check"><input type="checkbox" id="ovSeaIce" /> Sea ice</label>
      </div>
      <div class="row">
        <span>Sun</span>
        <label class="check"><input type="checkbox" id="terminatorToggle" /> Day/night terminator</label>
      </div>
      <div class="row" id="cameraPresets"></div>
      <div id="satStatus" class="hint"></div>
      <div id="terrainStatus" class="hint"></div>
    </div>

    <div id="provPanel" class="panel">
      <button id="provToggle" class="prov-toggle">Provenance ▸</button>
      <div id="provBody" class="collapsed">
        <div class="hint">Click the globe to inspect the tile under the cursor.</div>
        <div id="provContent"></div>
      </div>
    </div>

    <div id="timeBar" class="panel">
      <button id="dayPrev" title="Previous day">◀</button>
      <input type="range" id="timeSlider" />
      <button id="dayNext" title="Next day">▶</button>
      <button id="dayToday" title="Jump to most recent imagery">Today</button>
      <span id="timeLabel"></span>
    </div>

    <div id="credits" class="hint">
      Imagery: NASA GIBS / Worldview · GOES: NOAA · Orbits: CelesTrak · Engine: CesiumJS
    </div>

  </body>
</html>
